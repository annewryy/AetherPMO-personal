# DB 자격증명 Secret — 예시(플레이스홀더). 실값은 커밋하지 말 것.
# 생성 예: kubectl -n aetherpms-dev create secret generic aetherpms-db-secret \
#            --from-literal=username=aetherpms \
#            --from-literal=password='<실제값>' \
#            --from-literal=root-password='<실제값>'
# 또는 SealedSecret/Vault로 관리(권장). 이 파일은 apply 대상 아님(참고용).
apiVersion: v1
kind: Secret
metadata:
  name: aetherpms-db-secret
  namespace: aetherpms-dev
type: Opaque
stringData:
  username: aetherpms
  password: CHANGE_ME
  root-password: CHANGE_ME
