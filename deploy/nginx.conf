# AetherPMS web 컴포넌트 (0013 §C) — 정적 /app(Vue 빌드) 서빙 + /api 리버스프록시.
# same-origin이라 CORS 불필요. API_BASE는 런타임에 sub_filter로 주입(프론트 소스 무변경).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;   # 리다이렉트를 상대경로로 → 호스트 포트(8088) 보존

    # 루트 진입 → 제품 화면(/app)으로
    location = / {
        return 302 /app/;
    }

    # Vue SPA (vue-router history) — 없는 경로는 index.html로 폴백.
    # dataClient가 window.API_BASE 있을 때 백엔드 모드로 동작하므로,
    # location.origin을 주입해 same-origin /api 로 향하게 한다(0013 C-5 API_BASE 전환).
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        sub_filter '</head>' '<script>window.API_BASE=location.origin;</script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # 백엔드(Spring app) 리버스프록시. dataClient 경로가 이미 /api 접두.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
