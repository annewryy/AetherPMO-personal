name: AetherPMO CI Verification

on:
  push:
    branches:
      - feature/ai-pmo-automation
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Code & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax
        run: |
          node --check api/ai/chat.js
          node --check api/ai/health.js
          node --check ai-automation.js
          node --check build-config.js

      - name: Security Check - No Plaintext Secrets in Code
        run: |
          echo "Scanning for leaked credentials with precise pattern matching..."
          FAIL=0

          # 1. Supabase Secret API Key (sb_secret_ followed by 20+ alphanumerics)
          # Exclude the workflow file itself to prevent false positives
          SECRET_MATCHES=$(grep -rnE "sb_secret_[A-Za-z0-9_-]{20,}" . --exclude-dir={.git,node_modules} --exclude="verify.yml" || true)
          if [ -n "$SECRET_MATCHES" ]; then
            echo "::error::Detected actual plaintext Supabase Secret API Key!"
            FAIL=1
          fi

          # 2. Leaked Legacy service_role JWT Key (exact prefix match)
          LEGACY_MATCHES=$(grep -rn "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoYnlmemltdnBra3Vsam5tZmN0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZS" . --exclude-dir={.git,node_modules} --exclude="verify.yml" || true)
          if [ -n "$LEGACY_MATCHES" ]; then
            echo "::error::Detected leaked legacy service_role JWT key in source code!"
            FAIL=1
          fi

          if [ $FAIL -eq 1 ]; then
            echo "Security scan failed. Please remove plaintext secrets from the repository."
            exit 1
          fi

          echo "Security scan passed: No hardcoded credentials detected."