name: NIRS 115 catalog validation
on:
  push:
    branches:
      - feature/nirs-pmo-standard-115
  pull_request:
    paths:
      - 'api/ai/chat.js'
      - 'ai-automation.js'
      - 'data/nirs_pmo_standard_115.json'
      - 'scripts/nirs_115_catalog.sql'
      - 'scripts/test_nirs_catalog.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6836 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check api/ai/chat.js
      - run: node --check ai-automation.js
      - run: node scripts/test_nirs_catalog.js
