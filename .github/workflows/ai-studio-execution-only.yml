name: AI Studio execution-only project selector tests
on:
  push:
    branches: [feature/ai-studio-execution-projects-only]
  pull_request:
    paths:
      - 'ai-automation.js'
      - 'scripts/test_ai_studio_execution_selects.js'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6836 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check ai-automation.js
      - run: node scripts/test_ai_studio_execution_selects.js
